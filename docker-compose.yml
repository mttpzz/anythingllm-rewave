services:
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    restart: unless-stopped
    ports:
      - "3001:3001"
    cap_add:
      - SYS_ADMIN            # required by the headless browser of the web-browsing skill
    environment:
      - STORAGE_DIR=/app/server/storage
      # Signs login session tokens. AnythingLLM otherwise keeps it in the container's internal
      # /app/server/.env, which is wiped on every recreate/rebuild -> login breaks. Setting it
      # here makes it survive recreates. Users/passwords are in ./storage and unaffected.
      - JWT_SECRET=${JWT_SECRET}
      # LLM provider: RouteLLM (OpenAI-compatible gateway). RouteLLM routes each prompt to a
      # strong model (complex tasks) or a weak/cheap model (simple tasks) by complexity.
      # AnythingLLM just sees ONE OpenAI-compatible endpoint; the routing happens in RouteLLM.
      - LLM_PROVIDER=generic-openai
      - GENERIC_OPEN_AI_BASE_PATH=http://routellm:6060/v1
      # router-<algo>-<threshold>: which router + how much traffic goes to the strong model.
      - GENERIC_OPEN_AI_MODEL_PREF=router-${ROUTELLM_ROUTER}-${ROUTELLM_THRESHOLD}
      # Placeholder key: RouteLLM does not validate inbound auth (internal-only), but AnythingLLM
      # requires a non-empty API-key field. Any string works.
      - GENERIC_OPEN_AI_API_KEY=${ROUTELLM_API_KEY}
      - GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT=${GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT}
      - GENERIC_OPEN_AI_MAX_TOKENS=${GENERIC_OPEN_AI_MAX_TOKENS}
      # Auto-approve agent tool calls (no per-call confirmation). See .env for the security note.
      - AGENT_AUTO_APPROVED_SKILLS=${AGENT_AUTO_APPROVED_SKILLS}
      # Multi-user: after first boot set the admin password in the UI
      # and enable multi-user mode (Settings -> Security/Users).
    depends_on:
      # Wait until RouteLLM is actually serving (its healthcheck passes), not just started.
      # bert loads a model on boot (~2 min); without this the first chats fail.
      routellm:
        condition: service_healthy
    volumes:
      # Persistent AnythingLLM storage (DB, documents, vector cache, config)
      - ./storage:/app/server/storage
      # SharePoint folder exposed to the File System agent.
      # MUST live under anythingllm-fs/: the skill cannot access anything outside it.
      # Long syntax is used so a Windows source path (drive-letter colon, spaces) works.
      # Host path comes from SHAREPOINT_MOUNT_PATH in .env:
      #   Windows test -> Microsoft OneDrive-synced SharePoint folder
      #   Ubuntu prod  -> abraunegg onedrive sync folder (/mnt/sharepoint)
      - type: bind
        source: ${SHAREPOINT_MOUNT_PATH}
        target: /app/server/storage/anythingllm-fs/sharepoint

  # RouteLLM: complexity-based LLM router (OpenAI-compatible). Built from ./routellm
  # (no official image exists). Reached only by AnythingLLM on the compose network — not
  # published to the host. Routes: complex prompt -> strong model, simple prompt -> weak/cheap.
  routellm:
    build: ./routellm
    container_name: routellm
    restart: unless-stopped
    environment:
      # litellm uses this to call the strong/weak Anthropic models.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Only used by the mf/sw_ranking routers to embed the prompt. Leave empty and set
      # ROUTELLM_ROUTER=bert for a fully local router that needs no OpenAI key.
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ROUTELLM_ROUTER=${ROUTELLM_ROUTER}
      - ROUTELLM_STRONG_MODEL=${ROUTELLM_STRONG_MODEL}
      - ROUTELLM_WEAK_MODEL=${ROUTELLM_WEAK_MODEL}
      # Fixed temperature forced on every request (see routellm/patch_schema.py).
      - ROUTELLM_TEMPERATURE=${ROUTELLM_TEMPERATURE}
      # NOTE: no ROUTELLM_API_KEY here — RouteLLM's --api-key would override the provider keys
      # (see routellm/Dockerfile). The server has no inbound auth; it is internal-only.
      # litellm is bundled inside routellm (dep of routellm[serve]) — no separate service.
      # Logs the actual provider call (model name) litellm makes for each request.
      - LITELLM_LOG=INFO
      # AnythingLLM sends presence_penalty/frequency_penalty; Anthropic rejects them.
      # Drop unsupported params instead of erroring (litellm.drop_params).
      - LITELLM_DROP_PARAMS=True
    expose:
      - "6060"
    # uvicorn only starts serving /docs after the router model has loaded, so a successful
    # probe means "ready". start_period covers the bert model load (~2 min) without failing.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6060/docs', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 240s

  # Reverse proxy: exposes AnythingLLM at https://any.rewave.local (internal CA).
  # In production this also fronts HTTPS; in the Windows test it lets you use the
  # domain instead of localhost:3001. Config in caddy/Caddyfile.
  caddy:
    image: caddy:2-alpine
    container_name: caddy-any
    restart: unless-stopped
    ports:
      # Port 80 omitted: reserved by Windows http.sys on this host, and internal
      # TLS (.local) needs no ACME/HTTP-challenge. On prod re-add "80:80" for the
      # HTTP->HTTPS redirect + Let's Encrypt challenge.
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist the local CA + issued certs across restarts (keeps the trusted CA stable).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - anythingllm

volumes:
  caddy_data:
  caddy_config:
